<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Autopeças Express</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body, html {
      height: 100%;
      background-color: #0056b3;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f2f2f2;
    }

    .form {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 300px;
    }

    .form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    .form button {
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form button:hover {
      background-color: #0056b3;
    }

    .form p {
      text-align: center;
      font-size: 14px;
      color: #333;
    }

    .form a {
      text-decoration: none;
      color: #007bff;
      font-weight: bold;
    }

    .form a:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <form class="form">
      <h2>Cadastro</h2>
      
      <input type="text" name="nome" placeholder="Nome Completo" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="senha" placeholder="Senha" required>
      <input type="password" name="confirmar_senha" placeholder="Confirmar Senha" required>
      
      <button type="submit"><a href="index.html">Cadastrar</a></button>

      <p>Já tem uma conta? <a href="login.html">Login</a></p>
    </form>
  </div>
</body>
</html>
